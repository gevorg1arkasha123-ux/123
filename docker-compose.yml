# Запуск: заполните .env (обязательно DOMAIN) и выполните  docker compose up -d
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      UPLOADS_DIR: /app/uploads
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads

  # Caddy сам получает и продлевает HTTPS-сертификат для вашего домена
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  caddy_data:
