<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KVQ AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="appbar">
    <button class="logo" data-tab="home" aria-label="KVQ AI — на главную"><span class="logo-mark">K</span><span>KVQ<em>AI</em></span></button>
    <button class="wallet" id="wallet" aria-label="Баланс, пополнить">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><rect x="4" y="8" width="16" height="11" rx="2.5"/><path d="M16 13.5h.01"/></svg>
      <span id="walletSum">…</span>
      <span class="wallet-plus" aria-hidden="true">+</span>
    </button>
  </header>

  <main id="view"></main>

  <nav class="dock" aria-label="Разделы">
    <button data-tab="home" class="tab active"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="9" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="5.5" rx="1.5"/><rect x="4" y="15.5" width="6.5" height="4.5" rx="1.5"/><rect x="13.5" y="11.5" width="6.5" height="8.5" rx="1.5"/></svg><span>Шаблоны</span></button>
    <button data-tab="create" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 10-10M14 6V3M14 14v3M18 10h3M10 10H7M16.5 7.5l2-2M16.5 12.5l2 2"/></svg><span>Студия</span></button>
    <button data-tab="history" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M7 5v14M17 5v14M3 9.5h4M3 14.5h4M17 9.5h4M17 14.5h4"/></svg><span>Мои работы</span></button>
    <button data-tab="profile" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.4 3.8-5 7-5s5.8 1.6 7 5"/></svg><span>Профиль</span></button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
